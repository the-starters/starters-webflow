<!-- Jai call trial pilot: staging host only -->
<script>
;(async function () {
  if (location.hostname !== 'the-starters-3-0.webflow.io' || !/^\/complete-profile-trial\/?$/.test(location.pathname)) return
  if (document.readyState === 'loading') {
    await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, { once: true }))
  }
  const form = document.querySelector('form[data-brand-trial-terms-form="true"]')
  const details = form?.closest('section')
  if (!details) throw new Error('Trial form section was not found')
  if (document.querySelector('[data-complete-profile-call-step]')) return

  const primary = form.querySelector('button[type="submit"]')?.closest('[data-button-theme]')
  const primaryText = primary?.querySelector('.button_main-text')
  if (!primaryText) throw new Error('The existing profile submit Button component was not found')
  primaryText.textContent = 'Continue'
  primary.querySelector('button[type="submit"]').setAttribute('aria-label', 'Continue')
  details.setAttribute('data-jai-trial-first-step', '')

  const native = {}
  for (const [key, label, variant] of [
    ['skip', 'Continue to dashboard', 'tertiary'],
    ['book', 'Book a free call', 'primary'],
    ['done', 'Go to dashboard', 'primary'],
  ]) {
    const holder = document.querySelector('[data-jai-trial-native-button="' + key + '"]')
    const wrap = holder?.querySelector('[data-button-theme][data-button-style]')
    const labelNode = wrap?.querySelector('.button_main-text')
    let button = wrap?.querySelector('button.clickable_btn')
    if (!button) {
      const link = wrap?.querySelector('a.clickable_btn')
      if (link) {
        button = document.createElement('button')
        button.className = link.className
        link.replaceWith(button)
      }
    }
    if (!holder || !wrap || !labelNode || !button) throw new Error('Missing native trial Button: ' + key)
    button.type = 'button'
    button.classList.remove('w-form-loading')
    button.removeAttribute('disabled')
    button.removeAttribute('aria-disabled')
    button.parentElement.removeAttribute('aria-disabled')
    holder.removeAttribute('aria-disabled')
    wrap.removeAttribute('aria-disabled')
    button.setAttribute('aria-label', label)
    labelNode.textContent = label
    wrap.setAttribute('data-button-theme', 'black')
    wrap.setAttribute('data-button-style', variant)
    wrap.querySelectorAll('.button_main-element > :not(.button_main-text):not(.button_main-line)').forEach(node => { node.hidden = true; node.style.display = 'none' })
    native[key] = { holder, wrap, labelNode, button }
  }

  const syncTheme = (component, disabled) => component.wrap.setAttribute('data-button-theme', disabled ? 'disabled' : 'black')
  let engineConfirm
  let engineObserver
  native.book.button.addEventListener('click', () => engineConfirm?.click())
  const nativeTrialConfirm = (confirm, skip) => {
    if (engineObserver) engineObserver.disconnect()
    engineConfirm = confirm
    confirm.hidden = true
    confirm.tabIndex = -1
    confirm.setAttribute('aria-hidden', 'true')
    const sync = () => {
      const label = confirm.textContent || 'Book a free call'
      native.book.labelNode.textContent = label
      native.book.button.setAttribute('aria-label', label)
      native.book.button.disabled = confirm.disabled
      native.book.button.setAttribute('aria-disabled', confirm.disabled ? 'true' : 'false')
      syncTheme(native.book, confirm.disabled)
    }
    engineObserver = new MutationObserver(sync)
    engineObserver.observe(confirm, { attributes: true, attributeFilter: ['disabled'], childList: true, characterData: true, subtree: true })
    native.skip.holder.after(native.book.holder, confirm)
    sync()
  }
  new MutationObserver(() => syncTheme(native.skip, native.skip.button.disabled))
    .observe(native.skip.button, { attributes: true, attributeFilter: ['disabled'] })

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script')
      script.src = src
      script.onload = resolve
      script.onerror = () => reject(new Error('Unable to load ' + src.split('/').pop()))
      document.head.append(script)
    })
  }
  const base = 'https://cdn.jsdelivr.net/gh/the-starters/starters-webflow@v1.59.737/v3/'
  if (typeof window.xanoAuthFetch !== 'function' || typeof window.getXanoAuthToken !== 'function') {
    await loadScript(base + 'scheduling-auth.js')
  }
  await loadScript(base + 'paid-call-brand-payment.js')
  await loadScript(base + 'free-call-booking.js')
  if (!window.jQuery?.fn?.datepicker) await loadScript('https://code.jquery.com/ui/1.14.1/jquery-ui.min.js')

  const layout = document.createElement('template')
  layout.innerHTML = `
    <style>
      [data-complete-profile-call-step][hidden], [data-complete-profile-call-step] [hidden] { display:none !important; }
      [data-jai-trial-first-step], [data-complete-profile-call-step] { --jai-small:3.75rem; --jai-headroom:8.3125rem; --jai-space:1.5rem; color:#1e211e; }
      [data-jai-trial-first-step] > .padding-global, [data-complete-profile-call-step] > .padding-global { padding-block-start:calc(var(--jai-headroom) + var(--jai-small)); padding-block-end:var(--jai-small); }
      [data-jai-trial-first-step] .complete-profile_layout { align-items:flex-start; }
      [data-complete-profile-call-step] { position:relative; overflow:hidden; min-block-size:100svh; background:linear-gradient(111.6258deg,#caded9 25.117%,#77a2ab 100.36%); }
      [data-complete-profile-call-step] [data-jai-trial-layout] { display:grid; grid-template-columns:minmax(0,28.5rem) minmax(0,51.25rem); justify-content:space-between; align-items:start; gap:var(--jai-space) 2.5rem; }
      [data-jai-trial-greeting] { grid-column:1; grid-row:1; display:grid; gap:1.25rem; }
      [data-jai-trial-greeting] > div { display:grid; gap:1.25rem; }
      [data-jai-trial-greeting] h1 { margin:0; font-size:3.875rem; line-height:1.2; letter-spacing:-.11625rem; }
      [data-jai-trial-greeting] p { margin:0; font-size:1.125rem; line-height:1.7; }
      [data-jai-trial-card] { grid-column:2; grid-row:1 / span 2; min-inline-size:0; inline-size:100%; max-inline-size:none; border-radius:.25rem; background:#fff; overflow:hidden; }
      [data-jai-trial-card] > .complete-profile_form { inline-size:100%; max-inline-size:none; }
      [data-jai-trial-quote] { position:relative; grid-column:1; grid-row:2; align-self:start; margin:0; margin-inline-start:clamp(5rem,calc(20vw - 6.1875rem),13.8125rem); padding-block-start:.3125rem; inline-size:18.125rem; min-inline-size:0; }
      [data-jai-trial-quote] blockquote { border:0; margin:0 0 2.25rem; padding:0; font-size:1.75rem; line-height:1.2; letter-spacing:-.0525rem; }
      [data-jai-trial-quote] figcaption { display:grid; justify-items:start; text-align:start; gap:.6875rem; font-size:1.125rem; line-height:1.7; }
      [data-jai-trial-quote] strong { font-weight:600; line-height:1; }
      [data-jai-trial-portrait] { position:absolute; inset-block-start:38.8125rem; inset-inline-start:-5.9375rem; inline-size:31.5625rem; block-size:auto; pointer-events:none; }
      [data-jai-trial-card] [data-complete-profile-call-unavailable], [data-jai-trial-card] [data-complete-profile-call-success] { padding:2.5rem; }
      [data-jai-trial-summary] { display:flex; flex-wrap:wrap; gap:1rem; margin-block:1.25rem; }
      [data-jai-trial-summary] > span { display:inline-flex; align-items:center; border:.0625rem solid #eee; border-radius:.25rem; padding:.25rem .625rem; }
      [data-jai-trial-success-action] { display:flex; justify-content:flex-end; margin-block-start:2.5rem; }
      [data-complete-profile-call-step] [data-jai-trial-card] [data-complete-profile-call-footer] { display:flex; gap:.5rem; align-items:center; justify-content:flex-end; padding:1.5rem 2rem; min-block-size:6.125rem; }
      [data-complete-profile-call-step] [data-paid-calendar-element="confirm"][hidden],
      [data-complete-profile-call-step="unavailable"] [data-jai-trial-native-button="book"] { display:none; }
      [data-complete-profile-call-step] [data-jai-trial-native-button] .clickable_wrap { z-index:1; }
      [data-complete-profile-call-step] [data-paid-calendar-element="month"] .ui-datepicker { width:100% !important; max-width:none !important; box-sizing:border-box; }
      [data-complete-profile-call-step] [data-paid-calendar-element="timezone-control"] { position:relative; }
      [data-complete-profile-call-step] [data-paid-calendar-element="timezone-control"]::before,
      [data-complete-profile-call-step] [data-paid-calendar-element="timezone-control"]::after { position:absolute; content:""; inset-block-start:50%; transform:translateY(-50%); pointer-events:none; background-position:center; background-repeat:no-repeat; background-size:contain; }
      [data-complete-profile-call-step] [data-paid-calendar-element="timezone-control"]::before { inset-inline-start:.875rem; inline-size:1.25rem; block-size:1.25rem; background-image:url("https://cdn.prod.website-files.com/69c573f20f82bd0f3384032c/6af32e23e16e653acd5d293d_complete-profile-globe.svg"); }
      [data-complete-profile-call-step] [data-paid-calendar-element="timezone-control"]::after { inset-inline-end:1rem; inline-size:.875rem; block-size:.875rem; background-image:url("https://cdn.prod.website-files.com/69c573f20f82bd0f3384032c/6af32e2479484b73828422eb_complete-profile-down.svg"); }
      [data-complete-profile-call-step] [data-paid-calendar-element="timezone-control"] [data-paid-calendar-element="timezone"] { appearance:none; padding-inline:2.75rem; font-weight:400; }
      [data-complete-profile-call-step] [data-paid-calendar-element="month"] .ui-datepicker-header :is(.ui-datepicker-prev,.ui-datepicker-next)::after { transform:none; inline-size:1.25rem; block-size:1.25rem; border:0; background:center / contain no-repeat; }
      [data-complete-profile-call-step] [data-paid-calendar-element="month"] .ui-datepicker-prev::after { background-image:url("https://cdn.prod.website-files.com/69c573f20f82bd0f3384032c/6af32e2586ca023172754ce8_complete-profile-previous.svg") !important; }
      [data-complete-profile-call-step] [data-paid-calendar-element="month"] .ui-datepicker-next::after { background-image:url("https://cdn.prod.website-files.com/69c573f20f82bd0f3384032c/6af32e261502cc49dc8c1a3d_complete-profile-next.svg") !important; }
      @media (min-width:62rem) {
        [data-complete-profile-call-step] [data-paid-calendar-element="shell"] { min-block-size:30.8125rem; }
      }
      @media (max-width:61.9375rem) {
        [data-complete-profile-call-step] { background:linear-gradient(93.0101deg,#caded9 25.117%,#77a2ab 100.36%); }
        [data-jai-trial-first-step], [data-complete-profile-call-step] { --jai-headroom:5.75rem; --jai-small:2rem; }
        [data-jai-trial-first-step] > .padding-global, [data-complete-profile-call-step] > .padding-global { padding-inline:1rem; }
        [data-complete-profile-call-step] [data-jai-trial-layout] { grid-template-columns:minmax(0,1fr); gap:1.5rem; }
        [data-jai-trial-greeting], [data-jai-trial-greeting] > div { gap:.75rem; }
        [data-jai-trial-greeting] h1 { font-size:2.5rem; letter-spacing:-.075rem; }
        [data-jai-trial-greeting] p { font-size:1rem; }
        [data-jai-trial-card] { grid-column:1; grid-row:2; }
        [data-jai-trial-quote] { grid-column:1; grid-row:3; padding:0; margin:0; inline-size:100%; }
        [data-jai-trial-quote] blockquote { font-size:1.5rem; letter-spacing:-.045rem; }
        [data-jai-trial-portrait] { position:relative; inset:auto; inline-size:25.125rem; max-inline-size:none; margin-inline-start:-1.8125rem; margin-block-start:1.5rem; }
        [data-complete-profile-call-step] [data-jai-trial-card] [data-complete-profile-call-footer] { flex-direction:column-reverse; align-items:stretch; min-block-size:0; padding:1rem; }
        [data-complete-profile-call-step] [data-jai-trial-native-button],
        [data-complete-profile-call-step] [data-jai-trial-native-button] .button_main-wrap,
        [data-complete-profile-call-step] [data-jai-trial-native-button] .button_main-element { inline-size:100%; }
        [data-jai-trial-card] [data-complete-profile-call-unavailable], [data-jai-trial-card] [data-complete-profile-call-success] { padding:1.5rem 1rem; }
      }
    </style>
    <section class="section_complete-profile" data-complete-profile-call-step hidden>
      <div class="padding-global padding-section-small">
        <div class="container-large">
          <div class="complete-profile_layout" data-jai-trial-layout>
            <div class="complete-profile_heading-wrapper" data-jai-trial-greeting>
              <div data-complete-profile-call-heading>
                <h1 class="heading-style-title">Before you dive in, book a free call with Jai</h1>
                <p>Get personalized talent recommendations and guidance on how to make the most out of The Starters.</p>
              </div>
              <div data-complete-profile-call-heading-done hidden>
                <h1 class="heading-style-title">You're all set. Talk soon.</h1>
                <p>In the meantime, explore vetted talent and start building your team.</p>
              </div>
            </div>
            <div class="complete-profile_form-block" data-jai-trial-card>
              <div class="complete-profile_form">
                <div data-complete-profile-call-calendar></div>
                <div data-complete-profile-call-unavailable hidden>
                  <h2>Jai's calendar isn't loading right now</h2>
                  <p>You can still dive in. Book a free call with Jai any time from his profile.</p>
                </div>
                <div class="complete-profile_button-wrapper" data-complete-profile-call-footer></div>
                <div data-complete-profile-call-success hidden>
                  <h2>Call Requested</h2>
                  <p booking-success-text></p>
                  <div data-jai-trial-summary>
                    <span booking-element="paid-meeting"></span>
                    <span booking-element="start-date"></span>
                    <span booking-element="start-time"></span>
                    <span booking-element="price"></span>
                  </div>
                  <p booking-element-wrap><span booking-element="context"></span></p>
                  <div data-jai-trial-success-action></div>
                </div>
              </div>
            </div>
            <figure data-jai-trial-quote>
              <blockquote class="heading-style-h3">We exist to help e-commerce brands build elite teams at a fraction of the cost</blockquote>
              <figcaption><strong>Jai Dolwani</strong><span>Founder of the Starters</span></figcaption>
            </figure>
          </div>
          <img data-jai-trial-portrait src="https://cdn.prod.website-files.com/69c573f20f82bd0f3384032c/6af32d53d578507a40ac31e0_jai-dolwani-complete-profile.png" width="848" height="1024" alt="Jai Dolwani">
        </div>
      </div>
    </section>`
  const newStep = layout.content.querySelector('[data-complete-profile-call-step]')
  native.skip.button.setAttribute('data-complete-profile-call-continue', '')
  native.done.button.setAttribute('data-complete-profile-call-done', '')
  new MutationObserver(() => {
    const unavailable = newStep.getAttribute('data-complete-profile-call-step') === 'unavailable'
    native.skip.wrap.setAttribute('data-button-style', unavailable ? 'primary' : 'tertiary')
  }).observe(newStep, { attributes: true, attributeFilter: ['data-complete-profile-call-step'] })
  newStep.querySelector('[data-complete-profile-call-footer]').append(native.skip.holder, native.book.holder)
  newStep.querySelector('[data-jai-trial-success-action]').append(native.done.holder)
  details.setAttribute('data-complete-profile-details', '')
  details.after(layout.content)
  ;
