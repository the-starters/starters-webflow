    ['skip', 'Continue to dashboard', 'tertiary'],
    ['book', 'Book a free call', 'primary'],
    ['done', 'Go to dashboard', 'primary'],

    const holder = document.querySelector('[data-jai-trial-native-button="' + key + '"]')
    const wrap = holder?.querySelector('[data-button-theme][data-button-style]')

    let button = wrap?.querySelector('button.clickable_btn')
    if (!button) {
      const link = wrap?.querySelector('a.clickable_btn')
      if (link) {
        button = document.createElement('button')
        button.className = link.className
        link.replaceWith(button)
      }
    }
    if (!holder || !wrap || !labelNode || !button) throw new Error('Missing native trial Button: ' + key)
    button.type = 'button'
    button.classList.remove('w-form-loading')
    button.removeAttribute('disabled')
    button.removeAttribute('aria-disabled')
    button.parentElement.removeAttribute('aria-disabled')
    holder.removeAttribute('aria-disabled')
    wrap.removeAttribute('aria-disabled')
    button.setAttribute('aria-label', label)
    labelNode.textContent = label
    wrap.setAttribute('data-button-theme', 'black')
    wrap.setAttribute('data-button-style', variant)
    wrap.querySelectorAll('.button_main-element > :not(.button_main-text):not(.button_main-line)').forEach(node => { node.hidden = true; node.style.display = 'none' })
    native[key] = { holder, wrap, labelNode, button }
  }

  const syncTheme = (component, disabled) => component.wrap.setAttribute('data-button-theme', disabled ? 'disabled' : 'black')

  let engineObserver
  native.book.button.addEventListener('click', () => engineConfirm?.click())
  const nativeTrialConfirm = (confirm, skip) => {
    if (engineObserver) engineObserver.disconnect()
    engineConfirm = confirm
    confirm.hidden = true
    confirm.tabIndex = -1
    confirm.setAttribute('aria-hidden', 'true')
    const sync = () => {
      const label = confirm.textContent || 'Book a free call'
      native.book.labelNode.textContent = label
      native.book.button.setAttribute('aria-label', label)
      native.book.button.disabled = confirm.disabled
      native.book.button.setAttribute('aria-disabled', confirm.disabled ? 'true' : 'false')
      syncTheme(native.book, confirm.disabled)
    }
    engineObserver = new MutationObserver(sync)
    engineObserver.observe(confirm, { attributes: true, attributeFilter: ['disabled'], childList: true, characterData: true, subtree: true })
    native.skip.holder.after(native.book.holder, confirm)
    sync()
  }
  new MutationObserver(() => syncTheme(native.skip, native.skip.button.disabled))

      document.head.append(script)
    })
