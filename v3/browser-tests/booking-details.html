<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking details verification</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#eeefeb;color:#1f211d;font:16px Arial,sans-serif}nav{display:flex;gap:12px;margin-bottom:20px}button{font:inherit;cursor:pointer}dialog:not([open]){display:none}dialog{position:relative;display:block;margin:auto;border:0;border-radius:8px;padding:0;width:1040px;max-width:100%;background:white}header{padding:20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}h1{font-size:20px;margin:0}.button_main-wrap{position:relative;border-radius:4px;background:#1f211d;color:white;min-height:44px;min-width:110px}.button_main-wrap[data-button-style="secondary"]{background:white;color:#1f211d;border:1px solid #ddd}.clickable_wrap{position:absolute;inset:0}.clickable_btn{position:absolute;inset:0;width:100%;height:100%;opacity:0}.button_main-element{padding:12px 18px;pointer-events:none;text-align:center}.button_icon-spinner,.button_main-line{display:none}[schedule-step="success"]{padding:32px}[data-call-guest-fields]{padding:24px;flex-direction:column;gap:12px}[data-call-guest-row]{gap:8px}input,textarea{font:inherit;padding:10px;border:1px solid #ccc;border-radius:4px}#fixture-label{font-size:13px;color:#62675f;margin-bottom:16px}@media(max-width:600px){body{padding:8px}header{padding:16px}}
/* Sizing copied from the public Webflow page stylesheet referenced by card-setup-owner.html. */
.call-details_layout{flex-flow:column;align-items:flex-start;display:flex;overflow:scroll}.nylas_custom_container{margin-left:auto;margin-right:auto}
</style></head><body>
<p id="fixture-label">Local verification. Real booking scripts; synthetic availability and commands.</p>
<div booking-button-wrapper><div data-modal-trigger="popup-booking-main"><button id="book-entry">Book Call</button></div></div>
<dialog popup-booking-main data-modal-target="popup-booking-main"></dialog>
<div id="direct-calls"><button id="direct-free" data-service-card="component" data-type="free">Free call</button><button id="direct-paid" data-service-card="component" data-type="paid">Paid call</button></div>
<nav><div call-type-item><span call-type-price></span><button id="free" booking-popup-open data-type="free" data-config="fixture-free">Free call</button></div><div call-type-item><span call-type-price></span><button id="paid" booking-popup-open data-type="paid" data-config="fixture-paid">Paid call</button></div><button id="close">Close booking</button></nav>
<dialog popup-booking data-modal-target="popup-booking"><header><h1>Request a call</h1></header><div class="modal_content-layout"><div schedule-step="default" class="call-details_layout"><div class="nylas_custom_container" nylas-container></div><div id="legacy-host"></div></div><div schedule-step="success" style="display:none"><h2>Request sent</h2><p booking-success-text></p><p booking-element="start-date"></p><p booking-element="start-time"></p><p booking-element="context"></p><p booking-element="paid-meeting"></p><p booking-element="paid-call-message"></p><div success-call-buttons data-type="free">Free confirmation</div><div success-call-buttons data-type="paid">Paid confirmation</div></div></div></dialog>
<div id="reschedule"></div>
<script src="../paid-call-brand-payment.js"></script><script src="../free-call-booking.js"></script><script src="booking-details-fixture.js"></script>
</body></html>
