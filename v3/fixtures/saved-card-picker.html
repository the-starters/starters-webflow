<!doctype html><meta charset="utf-8"><title>Authored saved cards preview</title><link crossorigin="anonymous" href="https://cdn.prod.website-files.com/69c573f20f82bd0f3384032c/css/the-starters-3-0.webflow.shared.a83a3b567.min.css" integrity="sha384-qDo7VnUgEUvUHTeq2Tou/NujEaFN/fI4HZjdh+f/VOHix5+EkZd2ZmHMnKBGkBvR" rel="stylesheet" type="text/css"/>
<link crossorigin="anonymous" href="https://cdn.prod.website-files.com/69c573f20f82bd0f3384032c/css/the-starters-3-0.webflow.6a1fe279796deb958e2b86f9.f9efa5b04.opt.min.css" integrity="sha384-+e+lsErEN1zlMYY59pfiGs4rfSilUfAdzS4/MBDFi+l1iqhPVvZ271f38WrbIOJS" rel="stylesheet" type="text/css"/><style>body{padding:32px;background:#eee}main{max-width:640px;margin:24px auto;background:white;padding:24px}[hidden]{display:none!important}nav{display:flex;gap:16px}nav button{padding:8px;background:white;border:1px solid}</style><p>Local authored dashboard card picker. Synthetic responses only. No Stripe or Xano writes.</p><nav><button id="normal">Load cards</button><button id="reopen">Reinstall picker</button><button id="empty">Empty list</button><button id="failure">Fail next readback</button></nav><main><div booking-popup-content="payment-methods" class="call-sched_details-layout height-auto"><div class="call-details_layout height-auto"><p class="heading-style-h1">Your Cards</p><div class="pm-card" data-id="" pm-card-template=""><div class="pm-card__heading"><div class="pm-card__dots w-embed"><svg fill="none" height="8" viewbox="0 0 50 8" width="50" xmlns="http://www.w3.org/2000/svg">

</svg></div><div last-numbers="">1234</div><div class="pm-card__default" tag-default=""><div>Default</div></div></div><div class="pm-card__circle"><div class="pm-card__circle-inner"></div></div></div><div class="pm-list" customer-cards-list=""></div></div><div class="call-sched_button-group"><div class="button_main-wrap" data-button-style="secondary" data-button-theme="black" data-modal-trigger="popup-stripe-card" data-opp-element="loading-button" data-opp-loading="false" data-wf--button--style-button---size="default" popup-stripe-card-open=""><div class="clickable_wrap" type=""><button class="clickable_btn" type="button"></button></div><div class="button_main-element"><div class="button_main-text">Add payment method</div><div class="button_main-line"></div><div aria-hidden="true" class="w-layout-vflex button_icon-spinner" data-button-spinner=""><div class="button_spinner"></div></div></div></div><div class="button_main-wrap" data-button-style="primary" data-button-theme="black" data-opp-element="loading-button" data-opp-loading="false" data-wf--button--style-button---size="default" pm-use-this=""><div class="clickable_wrap" type=""><button class="clickable_btn" type="button"></button></div><div class="button_main-element"><div class="button_main-text">Use this card</div><div class="button_main-line"></div><div aria-hidden="true" class="w-layout-vflex button_icon-spinner" data-button-spinner=""><div class="button_spinner"></div></div></div></div></div></div></main><p id="proof" role="status"></p><script>window.module={exports:{}};</script><script src="../paid-call-brand-payment.js"></script><script>
const api=module.exports;
let defaultId='pm_one', empty=false, failNext=false, writes=0;
window.xanoAuthFetch=async(url,options)=>{
 if(!url.startsWith(api.XANO_BASE))throw Error('Unexpected host');
 await new Promise(resolve=>setTimeout(resolve,100));
 if(options.method==='POST'&&url===api.XANO_BASE+api.SET_DEFAULT_PATH){defaultId=JSON.parse(options.body).payment_method_id;writes++;return {ok:true,json:async()=>({environment:'test',bookable:true})}}
 if(options.method!=='GET'||url!==api.XANO_BASE+api.PAYMENT_METHODS_PATH)throw Error('Unexpected route');
 if(failNext){failNext=false;throw Error('Simulated readback failure')}
 return {ok:true,json:async()=>({environment:'test',has_more:false,next_cursor:'',items:empty?[]:[{id:'pm_one',brand:'visa',last4:'4242',exp_month:12,exp_year:2030,is_default:defaultId==='pm_one'},{id:'pm_two',brand:'mastercard',last4:'4444',exp_month:11,exp_year:2031,is_default:defaultId==='pm_two'}]})};
};
function installPicker(){return api.installSavedCardPicker(document.querySelector('[booking-popup-content="payment-methods"]'),{environment:'test',onSaved:id=>{document.getElementById('proof').textContent='Verified synthetic default: '+id+'; command calls: '+writes}});}
let picker=installPicker();
document.getElementById('reopen').onclick=()=>{picker=installPicker();picker.load()};
document.getElementById('normal').onclick=()=>{empty=false;picker.load()};
document.getElementById('empty').onclick=()=>{empty=true;picker.load()};
document.getElementById('failure').onclick=()=>{failNext=true;document.getElementById('proof').textContent='Next readback will fail'};
picker.load();
</script>
