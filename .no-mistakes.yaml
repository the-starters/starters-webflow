# Ordered fallback list: use whichever agent is available, preferring claude.
# claude is first because codex was SIGKILLed three times on this repo on
# 2026-08-08 (once at spawn, once ~26 minutes into a review step, once after
# 3s on retry), and each failure fails the whole run. Note `no-mistakes doctor`
# reporting codex runnable only proves it spawns, not that it survives a step.
# If claude is ever unavailable the pipeline falls back to codex rather than
# refusing to run.
agent: [claude, codex]

ignore_patterns:
  - "*.min.js"

intent:
  enabled: true

# This repository has no GitHub Actions or other PR status-check provider.
no_ci: true

test:
  evidence:
    store_in_repo: false
