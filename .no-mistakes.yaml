# Ordered fallback list: use whichever agent is available. Claude only:
# codex sits at its usage limit in this workspace and "available" here means
# it spawns, so codex-first burned one failed attempt at the start of every
# fix round before falling through to claude (observed through 2026-08-30).
# NOTE: this list selects on AVAILABILITY, not on crash recovery. If the
# selected agent dies or returns no output during a step, the run fails
# instead of switching agents.
agent: [claude]

ignore_patterns:
  - "*.min.js"

intent:
  enabled: true

test:
  evidence:
    store_in_repo: false
